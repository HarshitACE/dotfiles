##### ==========================================================
#####  Core / Terminal
##### ==========================================================

# Prefer a tmux terminfo if available (install: ncurses-term / tmux-terminfo on some distros)
# If you *know* you don't have it, keep xterm-256color.
set -g default-terminal "tmux-256color"

# Truecolor: tell tmux the terminal supports RGB
# (the Tc override is widely used and generally safe)
set -ga terminal-overrides ",xterm-256color:Tc,tmux-256color:Tc"

# Mouse support (scroll, select panes, resize)
set -g mouse on

# Reduce ESC delay (good for Vim), but 0 can be too aggressive in some terminals/SSH
# If you ever see weird key sequences, try 10 or 25.
set -s escape-time 10

# More scrollback
set -g history-limit 200000

# Better responsiveness with modern terminals
set -g focus-events on


##### ==========================================================
#####  Prefix / Keybindings
##### ==========================================================

# Use C-a as prefix (GNU screen style)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config quickly + confirm
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Start windows at 1 (and optionally panes at 1)
set -g base-index 1
set -g pane-base-index 1

# Renumber windows when one is closed (keeps things tidy)
set -g renumber-windows on


##### ==========================================================
#####  Status line / UI
##### ==========================================================

set -g status-style 'bg=#333333 fg=#5eacd3'

# Optional: nicer pane borders (comment out if you dislike)
set -g pane-border-style 'fg=#444444'
set -g pane-active-border-style 'fg=#5eacd3'


##### ==========================================================
#####  Copy mode (vi) + Clipboard
##### ==========================================================

set -g mode-keys vi

# v to begin selection (like Vim)
bind -T copy-mode-vi v send-keys -X begin-selection

# y to copy selection to system clipboard
# Linux (X11): xclip
# Wayland: wl-copy
# macOS: pbcopy
#
# Pick ONE that applies to you; xclip is kept as default below.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# If you’re on newer tmux, this can help integrate clipboard in some environments:
# set -g set-clipboard on


##### ==========================================================
#####  Pane navigation (vim-like)
##### ==========================================================

# If you meant Ctrl-^ (common "last window" muscle memory), use C-^
# If you actually want the literal caret key, keep '^'.
bind -r C-^ last-window

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R


##### ==========================================================
#####  Splits that keep current working directory
##### ==========================================================

# More ergonomic splits that stay in the current pane path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Optional: easy resize with repeat
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5


##### ==========================================================
#####  Handy utilities / popups
##### ==========================================================

# TODO popup/window: open ./TODO.md if present, else fallback file
# Use POSIX test + explicit shell to avoid [[ ... ]] portability issues.
bind -r D neww -c "#{pane_current_path}" 'sh -lc '"'"'if [ -e TODO.md ]; then exec nvim TODO.md; else exec nvim "$HOME/.dotfiles/personal/todo.md"; fi'"'"''

# Your existing helpers
bind-key -r i run-shell "tmux neww tmux-cht.sh"

# Popups
bind-key p display-popup -w 80% -h 60% -E "zsh"
bind-key g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"

# File picker popup (robust for spaces/newlines)
bind-key f display-popup  -w 90% -h 80% -E "sh -lc 'find . -type f -print0 | fzf --read0 --print0 | xargs -0 -r nvim'"

bind-key N display-popup -w 80% -h 80% -E "nvim ~/notes/quick-note.md"
bind-key H display-popup -w 90% -h 90% -E "htop"

bind-key A display-popup -d "#{pane_current_path}" -w 90% -h 80% -E "agent --mode=ask"
